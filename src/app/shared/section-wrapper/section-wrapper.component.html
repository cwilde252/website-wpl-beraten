<section
  [class]="areaClass()"
  [class.bg-paper]="theme() === 'cream'"
  [class.bg-mist]="theme() === 'sand'"
  [class.bg-ink]="theme() === 'ink'"
  [class.text-paper]="theme() === 'ink'"
  [class.on-ink]="theme() === 'ink'"
  [class.py-14]="padding() === 'normal'"
  [class.md:py-20]="padding() === 'normal'"
  [class.py-20]="padding() === 'large'"
  [class.md:py-28]="padding() === 'large'"
  [class.lg:py-32]="padding() === 'large'"
>
  <div class="sheet">
    <ng-content />
  </div>
</section>
