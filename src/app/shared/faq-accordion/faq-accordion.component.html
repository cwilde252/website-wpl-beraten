<div>
  @for (item of items(); track item.question) {
    <details class="group hairline" [attr.name]="exclusiveGroup()">
      <summary class="flex items-start justify-between gap-6 py-5">
        <h3 class="type-subhead">{{ item.question }}</h3>
        <span
          class="faq-marker shrink-0 mt-1 grid place-items-center w-8 h-8 rounded-full border border-edge-strong area-text"
          aria-hidden="true"
        >
          <svg
            width="14"
            height="14"
            viewBox="0 0 14 14"
            fill="none"
            stroke="currentColor"
            stroke-width="1.75"
            stroke-linecap="round"
          >
            <path d="M7 2.5v9M2.5 7h9" class="group-open:hidden" />
            <path d="M2.5 7h9" class="hidden group-open:block" />
          </svg>
        </span>
      </summary>
      <p class="type-body pb-6 text-ink-soft">{{ item.answer }}</p>
    </details>
  }
  <div class="hairline" aria-hidden="true"></div>
</div>
