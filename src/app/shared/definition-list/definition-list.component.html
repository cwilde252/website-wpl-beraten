<dl
  class="def-list"
  [class.def-list--two]="columns() === 2"
  [attr.aria-label]="ariaLabel() || null"
>
  @for (item of items(); track $index) {
    <!-- dt und dd müssen direkte Kinder dieses div bleiben (HTML-Definitionslisten-Regel). -->
    <div class="def-row">
      @if (item.reference) {
        <span class="def-ref t-small t-soft num" aria-hidden="true">{{ item.reference }}</span>
      }
      <dt class="t-h3">{{ item.term }}</dt>
      @if (item.description) {
        <dd class="t-body t-soft">{{ item.description }}</dd>
      }
    </div>
  }
</dl>
