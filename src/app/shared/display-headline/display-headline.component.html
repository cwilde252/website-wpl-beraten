@if (level() === 1) {
  <h1 [class]="size() === 'display' ? 't-display' : 't-h2'">
    @for (line of content().lines; track $index) {
      <span class="line">{{ line }}</span>
    }
  </h1>
} @else {
  <h2 [class]="size() === 'display' ? 't-display' : 't-h2'">
    @for (line of content().lines; track $index) {
      <span class="line">{{ line }}</span>
    }
  </h2>
}
