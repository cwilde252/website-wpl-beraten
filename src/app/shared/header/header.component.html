<header class="site-header z-40" [class.is-scrolled]="scrolled() || mobileMenuOpen()">
  <div class="sheet flex items-baseline justify-between gap-6 py-5 md:py-6">
    <a routerLink="/" class="wordmark no-underline" (click)="closeMobileMenu()">
      <span class="wordmark-name">{{ contact.personName }}</span>
      <span class="wordmark-role">{{ contact.role }}</span>
    </a>

    <nav class="hidden md:flex items-baseline gap-8" aria-label="Hauptnavigation">
      @for (item of navItems; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="nav-active" class="nav-link no-underline">{{
          item.label
        }}</a>
      }
    </nav>

    <button
      type="button"
      class="md:hidden self-center p-2 -mr-2 bg-transparent border-0 text-current cursor-pointer"
      (click)="toggleMobileMenu()"
      [attr.aria-expanded]="mobileMenuOpen()"
      aria-controls="mobile-nav"
      [attr.aria-label]="mobileMenuOpen() ? 'Menü schließen' : 'Menü öffnen'"
    >
      <svg
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        aria-hidden="true"
      >
        @if (mobileMenuOpen()) {
          <line x1="6" y1="6" x2="18" y2="18" />
          <line x1="18" y1="6" x2="6" y2="18" />
        } @else {
          <line x1="3" y1="9" x2="21" y2="9" />
          <line x1="3" y1="16" x2="21" y2="16" />
        }
      </svg>
    </button>
  </div>

  @if (mobileMenuOpen()) {
    <nav id="mobile-nav" class="md:hidden" aria-label="Mobilnavigation">
      <div class="sheet flex flex-col pb-5">
        @for (item of navItems; track item.path) {
          <a
            [routerLink]="item.path"
            (click)="closeMobileMenu()"
            class="type-subhead no-underline py-3 hairline"
            >{{ item.label }}</a
          >
        }
      </div>
    </nav>
  }
</header>
