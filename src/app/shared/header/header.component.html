<header
  class="site-header sticky top-0 z-40"
  [class.is-solid]="scrolled() || mobileMenuOpen()"
  [class.on-ink]="!scrolled() && !mobileMenuOpen()"
>
  <div class="sheet flex items-center justify-between py-4 md:py-5">
    <a
      routerLink="/"
      class="no-underline flex items-center gap-3"
      (click)="closeMobileMenu()"
      aria-label="Startseite"
    >
      <app-signet [size]="34" />
      <span class="leading-tight">
        <span class="block type-subhead text-lg">{{ contact.personName }}</span>
        <span class="header-role block text-sm">{{ contact.role }}</span>
      </span>
    </a>

    <nav class="hidden md:flex items-center gap-1" aria-label="Hauptnavigation">
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="nav-active"
          class="nav-link no-underline px-4 py-2 rounded-full"
          >{{ item.label }}</a
        >
      }
      <app-cta-link href="/kontakt" label="Erstgespräch" variant="ghost" class="ml-3" />
    </nav>

    <button
      type="button"
      class="md:hidden p-2 -mr-2 bg-transparent border-0 text-current cursor-pointer"
      (click)="toggleMobileMenu()"
      [attr.aria-expanded]="mobileMenuOpen()"
      aria-controls="mobile-nav"
      [attr.aria-label]="mobileMenuOpen() ? 'Menü schließen' : 'Menü öffnen'"
    >
      <svg
        width="26"
        height="26"
        viewBox="0 0 26 26"
        fill="none"
        stroke="currentColor"
        stroke-width="1.75"
        stroke-linecap="round"
        aria-hidden="true"
      >
        @if (mobileMenuOpen()) {
          <line x1="6.5" y1="6.5" x2="19.5" y2="19.5" />
          <line x1="19.5" y1="6.5" x2="6.5" y2="19.5" />
        } @else {
          <line x1="4" y1="9" x2="22" y2="9" />
          <line x1="4" y1="17" x2="16" y2="17" />
        }
      </svg>
    </button>
  </div>

  @if (mobileMenuOpen()) {
    <nav id="mobile-nav" class="md:hidden hairline" aria-label="Mobilnavigation">
      <div class="sheet flex flex-col py-4 gap-1">
        @for (item of navItems; track item.path) {
          <a
            [routerLink]="item.path"
            (click)="closeMobileMenu()"
            class="type-subhead no-underline py-3"
            >{{ item.label }}</a
          >
        }
        <div class="pt-4 pb-2">
          <app-cta-link href="/kontakt" label="Erstgespräch anfragen" variant="primary" />
        </div>
      </div>
    </nav>
  }
</header>
