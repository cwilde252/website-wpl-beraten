<app-section-indicator [sections]="sections" ariaLabel="Abschnitte der Leistungsseite" />

<section
  id="leistungen-start"
  class="bg-ink text-paper on-ink pt-28 md:pt-36 pb-14 md:pb-20"
  aria-label="Leistungen"
>
  <div class="sheet">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-x-12 gap-y-8 items-end">
      <div class="lg:col-span-7">
        <app-display-headline [content]="headline" [level]="1" size="display-sub" />
      </div>
      <p class="type-lead lg:col-span-5 text-paper-soft lg:pb-3">{{ lead }}</p>
    </div>
  </div>
</section>

<app-section-wrapper theme="cream" padding="large">
  <div id="bereiche">
    <app-service-tabs
      [areas]="areas"
      [initialSlug]="initialSlug()"
      (activated)="onAreaActivated($event)"
    />
  </div>
</app-section-wrapper>

<app-section-wrapper theme="sand" padding="large" accent="check">
  <div id="pruefungspflicht">
    <app-section-mark label="Werkzeug 1" reference="§§ 267, 267a HGB" />
    <h2 id="pruefungspflicht-check" class="type-headline mb-8">Prüfungspflicht-Check</h2>
    <app-audit-check headingId="pruefungspflicht-check" />
  </div>
</app-section-wrapper>

<app-section-wrapper theme="cream" padding="large" accent="beratung">
  <div id="fristen">
    <app-section-mark label="Werkzeug 2" reference="§§ 264, 316, 325 HGB" />
    <h2 class="type-headline mb-8">Wann ist was fällig?</h2>
    <app-fristen-timeline />
  </div>
</app-section-wrapper>

<app-section-wrapper theme="sand" padding="large">
  <div id="fragen">
    <app-section-mark label="Häufige Fragen" />
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-x-12 gap-y-8">
      <h2 class="type-headline lg:col-span-4">Was mich oft gefragt wird.</h2>
      <div class="lg:col-span-8">
        <app-faq-accordion [items]="faq" exclusiveGroup="wpl-faq" />
        <p class="type-body mt-10 mb-6">
          Ihre Frage ist nicht dabei? Schreiben Sie mir — ich antworte auch auf Fragen, aus denen
          kein Auftrag wird.
        </p>
        <app-cta-link href="/kontakt" label="Frage stellen" variant="ghost" />
      </div>
    </div>
  </div>
</app-section-wrapper>
