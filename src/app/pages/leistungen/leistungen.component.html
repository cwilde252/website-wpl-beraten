<section id="leistungen-start" class="wrap page-intro" aria-labelledby="leistungen-title">
  <h1 id="leistungen-title" class="t-display">
    @for (line of headline.lines; track $index) {
      <span class="line">{{ line }}</span>
    }
  </h1>
  <p class="t-lead t-soft mt-6">
    Wählen Sie den Bereich, der Sie gerade beschäftigt. Weiter unten finden Sie den
    Prüfungspflicht-Check und Antworten auf häufige Fragen.
  </p>
</section>

<section id="bereiche" class="wrap scroll-anchor" aria-label="Leistungsbereiche">
  <app-service-tabs
    [areas]="areas"
    [initialSlug]="initialSlug()"
    (activated)="onAreaActivated($event)"
  />
</section>

<section
  id="pruefungspflicht"
  class="wrap section scroll-anchor"
  aria-labelledby="pruefungspflicht-check"
>
  <app-register-sheet tone="check" [tabbed]="true">
    <h2 sheetTab id="pruefungspflicht-check" class="flex items-center gap-2.5">
      <span class="tone-dot" aria-hidden="true"></span>Prüfungspflicht-Check
    </h2>
    <app-audit-check headingId="pruefungspflicht-check" />
  </app-register-sheet>
</section>

<section id="fragen" class="wrap section--tight scroll-anchor" aria-labelledby="fragen-title">
  <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-8">
    <div class="lg:col-span-4">
      <h2 id="fragen-title" class="t-h2">Häufige Fragen</h2>
      <p class="t-body t-soft mt-5">Ihre Frage ist nicht dabei? Fragen Sie mich direkt.</p>
      <div class="mt-4">
        <app-action-link href="/kontakt" label="Frage stellen" variant="link" />
      </div>
    </div>
    <div class="lg:col-span-8">
      <app-faq-accordion [items]="faq" exclusiveGroup="wpl-faq" />
    </div>
  </div>
</section>
