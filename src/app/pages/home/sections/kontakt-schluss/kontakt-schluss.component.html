<app-section-wrapper theme="ink" padding="large">
  <div class="grid grid-cols-1 lg:grid-cols-12 gap-x-12 gap-y-10 items-end">
    <div class="lg:col-span-7">
      <app-signet [size]="44" class="mb-7 text-cream" />
      <h2 class="type-display">
        <span class="block">Reden wir</span>
        <span class="block">miteinander.</span>
      </h2>
    </div>

    <div class="lg:col-span-5 lg:pb-3">
      <p class="type-body text-cream-soft mb-8">
        Ob Pflichtprüfung, Beratungsbedarf oder eine einzelne Frage zur Steuerplanung: Schreiben Sie
        mir kurz, worum es geht. Im Erstgespräch klären wir, ob ich die Richtige dafür bin — und
        wenn nicht, sage ich Ihnen das auch.
      </p>
      <app-cta-link href="/kontakt" label="Erstgespräch anfragen" variant="primary" />
    </div>
  </div>
</app-section-wrapper>
