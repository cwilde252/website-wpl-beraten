<div class="hero-band" data-surface="pine">
  <section class="wrap hero" aria-labelledby="hero-title">
    <div class="hero-copy">
      <h1 id="hero-title" class="t-display">
        @for (line of headline.lines; track $index) {
          <span class="line">{{ line }}</span>
        }
      </h1>
      <p class="t-lead t-soft mt-7 md:mt-8">{{ lead }}</p>
      <div class="mt-9 md:mt-10 flex flex-wrap items-center gap-4">
        <app-action-link href="/kontakt" label="Erstgespräch vereinbaren" />
        <app-action-link
          href="/leistungen"
          fragment="pruefungspflicht"
          label="Muss ich prüfen lassen?"
          variant="quiet"
          [arrow]="false"
        />
      </div>
    </div>

    <div class="hero-visual">
      <!-- Der Bogen: eine offene Tür, in Sonne. Ohne Foto eine reine Farbfläche. -->
      <div class="arch">
        @if (portrait; as photo) {
          <img
            class="arch-photo"
            [ngSrc]="photo.src"
            [width]="photo.width"
            [height]="photo.height"
            [alt]="photo.alt"
            priority
          />
        }
      </div>
      <p class="note" data-surface="white">
        <span class="note-title">{{ note.title }}</span>
        <span class="t-small t-soft">{{ note.text }}</span>
      </p>
    </div>
  </section>
</div>
