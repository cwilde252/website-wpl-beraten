<section
  class="bg-graphite text-linen on-graphite min-h-[70vh] flex flex-col justify-center py-20 md:py-28"
  aria-label="Wiebke Lefevre, Wirtschaftsprüferin in Rottweil"
>
  <div class="sheet w-full">
    <div class="sheet-grid">
      <div class="margin-note">
        <span class="double-rule mb-3" aria-hidden="true"></span>
        <p class="type-label">Rottweil</p>
      </div>
      <div class="sheet-body">
        <app-display-headline [content]="headline" [level]="1" />
        <p class="type-lead mt-10 mb-12">{{ lead }}</p>
        <app-rule-link href="/leistungen" label="Leistungen ansehen" />
      </div>
    </div>
  </div>
</section>
