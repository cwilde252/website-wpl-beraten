<section
  class="pt-32 md:pt-40 pb-16 md:pb-24"
  aria-label="Wiebke Lefevre, Wirtschaftsprüferin in Rottweil"
>
  <div class="sheet">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-x-16 gap-y-12 items-end">
      <div class="lg:col-span-7">
        <span class="rule-mark area-pruefung mb-8" aria-hidden="true"></span>
        <app-display-headline [content]="headline" [level]="1" />
        <p class="type-lead mt-8">{{ lead }}</p>
        <p class="type-norm text-ink-soft mt-8">
          Erstgespräch unverbindlich · Region Rottweil und Schwarzwald-Baar
        </p>
      </div>

      <div class="lg:col-span-5">
        <app-portrait [src]="profile.portraitSrc" [alt]="profile.portraitAlt" />
      </div>
    </div>
  </div>
</section>

<!-- Die drei Wege. Als Liste mit aufklappbaren Antworten, nicht als Dialog:
     Die Idee „erst fragen, dann erzählen" bleibt, das Chatfenster geht. -->
<section class="pb-16 md:pb-24" aria-labelledby="einstieg-frage">
  <div class="sheet">
    <div class="leaf">
      <p class="leaf-note" id="einstieg-frage">{{ prompt }}</p>
      <ul class="leaf-body list-none m-0 p-0">
        @for (option of options; track option.id) {
          <li [class]="areaClass(option)">
            <details class="dialog hairline" name="hero-dialog">
              <summary class="dialog-question">
                <span class="type-subhead">{{ option.question }}</span>
                <span class="dialog-sign" aria-hidden="true"></span>
              </summary>
              <div class="dialog-answer">
                <p class="type-body">{{ option.answer }}</p>
                <div class="mt-5">
                  <app-cta-link
                    [href]="option.ctaPath"
                    [fragment]="option.ctaFragment"
                    [label]="option.ctaLabel"
                    variant="quiet"
                  />
                </div>
              </div>
            </details>
          </li>
        }
      </ul>
    </div>
  </div>
</section>
