<app-section-wrapper theme="sand" padding="large">
  <h2 class="type-headline mb-8 max-w-3xl">Drei Blickwinkel auf dasselbe Unternehmen.</h2>

  <ul class="list-none m-0 p-0 grid grid-cols-1 md:grid-cols-3 gap-5 lg:gap-6">
    @for (area of areas; track area.slug; let i = $index) {
      <li [class]="areaClass(area)" [appReveal]="i * 80">
        <a
          routerLink="/leistungen"
          [fragment]="area.slug"
          class="card card-interactive area-card no-underline text-ink h-full flex flex-col p-7 md:p-8"
        >
          <h3 class="type-subhead mb-3">{{ area.title }}</h3>
          <p class="type-body grow">{{ area.claim }}</p>
          <span
            class="area-text type-body text-base font-medium mt-6 inline-flex items-center gap-2"
          >
            Ansehen
            <svg
              class="area-arrow"
              width="16"
              height="16"
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M3 8h9.5M8.5 3.5 13 8l-4.5 4.5" />
            </svg>
          </span>
        </a>
      </li>
    }
  </ul>

  <div class="mt-12">
    <app-cta-link href="/leistungen" label="Alle Leistungen im Detail" variant="ghost" />
  </div>
</app-section-wrapper>
