<section class="wrap section" aria-labelledby="profil-title">
  <div class="grid grid-cols-1 lg:grid-cols-12 gap-10 lg:gap-8 items-center">
    @if (profile.portrait; as photo) {
      <div class="lg:col-span-4">
        <img
          class="w-full h-auto rounded-[1.75rem]"
          [ngSrc]="photo.src"
          [width]="photo.width"
          [height]="photo.height"
          [alt]="photo.alt"
        />
      </div>
    }
    <div [class]="profile.portrait ? 'lg:col-span-7 lg:col-start-6' : 'lg:col-span-8'">
      <h2 id="profil-title" class="t-h2">{{ profile.name }}</h2>
      <p class="t-lead mt-5">{{ profile.statement[0] }}</p>
      <div class="mt-8">
        <app-action-link href="/ueber-mich" label="Werdegang ansehen" variant="link" />
      </div>
    </div>
  </div>
</section>
