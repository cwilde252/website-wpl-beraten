<section class="wrap section" aria-labelledby="profil-title">
  <div class="grid grid-cols-1 lg:grid-cols-12 gap-12 lg:gap-8 items-start">
    <div class="lg:col-span-6">
      <h2 id="profil-title" class="t-h2">{{ headline }}</h2>
      <p class="t-lead mt-6">{{ profile.statement[0] }}</p>
      <div class="mt-6">
        <app-action-link href="/ueber-mich" label="Mehr über mich" variant="link" />
      </div>
    </div>
    <ol class="timeline lg:col-span-5 lg:col-start-8" aria-label="Stationen">
      @for (entry of stations; track entry.title; let first = $first) {
        <li [class.is-current]="first">
          <span class="timeline-period num">{{ entry.period }}</span>
          <span class="timeline-title">{{ entry.title }}</span>
          @if (entry.description) {
            <span class="t-small t-soft">{{ entry.description }}</span>
          }
        </li>
      }
    </ol>
  </div>
</section>
