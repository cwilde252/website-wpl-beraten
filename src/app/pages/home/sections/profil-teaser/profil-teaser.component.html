<section class="wrap section" aria-labelledby="profil-title">
  <div class="grid grid-cols-1 lg:grid-cols-12 gap-10 lg:gap-8 items-center">
    @if (profile.portrait; as photo) {
      <div class="lg:col-span-4">
        <img
          class="w-full h-auto rounded-[1.75rem]"
          [ngSrc]="photo.src"
          [width]="photo.width"
          [height]="photo.height"
          [alt]="photo.alt"
        />
      </div>
    }
    <div [class]="profile.portrait ? 'lg:col-span-7 lg:col-start-6' : 'lg:col-span-7'">
      <h2 id="profil-title" class="t-h2">{{ profile.name }}</h2>
      <p class="t-lead mt-5">{{ profile.statement[0] }}</p>
      <div class="mt-8">
        <app-action-link href="/ueber-mich" label="Werdegang ansehen" variant="link" />
      </div>
    </div>
    @if (!profile.portrait) {
      <!-- Solange kein Porträt freigegeben ist, trägt ein Auszug aus dem Werdegang die Spalte. -->
      <app-register-sheet tone="neutral" class="lg:col-span-4 lg:col-start-9">
        <ol class="stations" aria-label="Stationen">
          @for (entry of stations; track entry.title) {
            <li>
              <span class="t-small t-soft num">{{ entry.period }}</span>
              <span class="block font-semibold mt-0.5">{{ entry.title }}</span>
            </li>
          }
        </ol>
      </app-register-sheet>
    }
  </div>
</section>
