<app-section-wrapper theme="sand" padding="large">
  <div class="grid grid-cols-1 lg:grid-cols-12 gap-x-14 gap-y-10 items-center">
    <div class="lg:col-span-5">
      <app-portrait [src]="profile.portraitSrc" [alt]="profile.portraitAlt" />
    </div>

    <div class="lg:col-span-7">
      <h2 class="type-headline mb-6">{{ profile.name }}</h2>
      <p class="type-lead mb-6 max-w-none">{{ profile.statement[0] }}</p>
      <p class="type-body mb-9 text-ink-soft">{{ profile.statement[2] }}</p>
      <app-cta-link href="/ueber-mich" label="Werdegang ansehen" variant="quiet" />
    </div>
  </div>
</app-section-wrapper>
